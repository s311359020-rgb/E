<!DOCTYPE html>
<html lang="zh-Hant" data-t="cover">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f8">
<title>數位名片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{--bg:#f3f5f8;--fg:#101828;--sf:#fff;--ac:#2f5bea;--acf:#fff;--ax:#2f5bea;--r:22px;--lr:16px;--hf:inherit;--gap:14px;--avs:92px;--ser:"Noto Serif TC","Songti TC",Georgia,serif;--mu:color-mix(in srgb,var(--fg) 60%,var(--bg));--bd:color-mix(in srgb,var(--fg) 12%,transparent)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark}}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font:15px/1.65 system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-family:var(--bf,system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif);overflow-x:hidden;background-repeat:no-repeat}
#sheet,#modal,.toast{font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h3,p{margin:0}
h1,h3{font-family:var(--hf);font-weight:var(--hw,700)}
#card{width:100%;max-width:480px;margin:0 auto;padding-bottom:120px;overflow-x:hidden}

/* ===== 頭部 ===== */
.cv{display:none}
.who{display:flex;gap:16px;align-items:center;padding:calc(36px + env(safe-area-inset-top,0px)) 20px 8px}
.nm{flex:1}
.av{flex:none;width:min(var(--avs),34vw);height:min(var(--avs),34vw);overflow:hidden;background:var(--ac);color:var(--acf);display:grid;place-items:center;font-size:calc(var(--avs)*.36);font-weight:700}
.av img{width:100%;height:100%;object-fit:cover}
h1{font-size:28px;line-height:1.2;font-weight:var(--hw,700);overflow-wrap:anywhere}
.ti{margin-top:3px;overflow-wrap:anywhere}
.co{margin-top:2px;font-size:13px;font-weight:600;color:var(--ax);overflow-wrap:anywhere}
[data-av=circle] .av{border-radius:50%}
[data-av=rounded] .av{border-radius:30%}
[data-av=square] .av{border-radius:8px}
[data-av=blob] .av{border-radius:34% 66% 58% 42%/46% 40% 60% 54%}
[data-lay=center] .who{flex-direction:column;text-align:center;gap:14px}
[data-lay=center] h1{font-size:clamp(26px,7.6vw,30px)}
[data-lay=right] .who{flex-direction:row-reverse;justify-content:space-between}
[data-lay=right] h1{font-size:clamp(26px,8.4vw,34px);line-height:1.1}
[data-hdr=cover] .cv{display:block;height:220px;background:var(--ac) center/cover no-repeat;background-position:50% var(--fy,50%)}
[data-hdr=cover] .who{padding-top:0;align-items:flex-start}
[data-hdr=cover] .av{margin-top:calc(var(--avs)*-.5);border:4px solid var(--bg)}
[data-hdr=cover] .nm{margin-top:12px}
[data-hdr=cover][data-lay=center] .who{align-items:center}
[data-hdr=cover][data-lay=center] .nm{margin-top:0}
[data-hdr=band] .hd{background:var(--ac) var(--bandimg,none) center/cover no-repeat;color:var(--acf);border-radius:0 0 32px 32px;padding-bottom:24px}
[data-hdr=band] .co{color:var(--acf);opacity:.8}
[data-hdr=band] .ti{opacity:.92}
[data-hdr=band] .av{background:var(--acf);color:var(--ac)}

/* 人像背景頭部：照片當首頁上方背景，姓名疊在照片下緣 */
[data-hdr^=photo] .hd{position:relative;overflow:hidden;height:clamp(320px,100vw,480px);border-radius:0 0 28px 28px;color:#fff}
[data-hdr^=photo] .cv{display:block;position:absolute;inset:0;height:auto;background:var(--ac) center/cover no-repeat;background-position:50% var(--fy,50%)}
[data-hdr^=photo] .hd::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.78) 0,rgba(0,0,0,.34) 40%,transparent 68%);pointer-events:none}
[data-hdr^=photo] .who{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 22px 24px;flex-direction:column;align-items:flex-start;text-align:left;gap:0}
[data-hdr^=photo] .av{display:none}
[data-hdr^=photo] h1{color:#fff;font-size:clamp(28px,9vw,38px);text-shadow:0 2px 14px rgba(0,0,0,.35)}
[data-hdr^=photo] .ti{color:rgba(255,255,255,.94)}
[data-hdr^=photo] .co{color:#fff;opacity:.85}
[data-lay=center][data-hdr^=photo] .who{align-items:center;text-align:center}
[data-lay=right][data-hdr^=photo] .who{flex-direction:column;align-items:flex-end;text-align:right}
[data-hdr=photoc] .hd{margin:calc(14px + env(safe-area-inset-top,0px)) 14px 0;border-radius:30px;height:clamp(320px,98vw,460px)}
[data-hdr=photofull] .hd{height:clamp(440px,76vh,680px);height:clamp(440px,76dvh,680px)}

/* ===== 內容區 ===== */
.secs{display:grid;gap:var(--gap);padding:18px 20px 0}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px}
.box h3{font-size:16px;margin-bottom:6px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.mu{color:var(--mu);font-size:13px}
[data-box=outline] .box{background:transparent;border:1.5px solid color-mix(in srgb,var(--fg) 22%,transparent)}
[data-box=flat] .box{background:none;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:14px 2px}
[data-box=glass] .box{background:color-mix(in srgb,var(--sf) 60%,transparent);border:1px solid color-mix(in srgb,var(--fg) 14%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
[data-box=shadow] .box{border:0;box-shadow:0 8px 28px color-mix(in srgb,var(--fg) 10%,transparent)}
/* 快捷按鈕列 */
.qa{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:8px;text-align:center}
.qa a{display:grid;gap:6px;justify-items:center;font-size:12px;font-weight:600;color:var(--mu)}
.qa i{width:54px;height:54px;border-radius:min(calc(var(--lr)*1.4),27px);background:var(--sf);border:1px solid var(--bd);color:var(--ax);display:grid;place-items:center;transition:transform .15s}
.qa a:active i{transform:scale(.94)}
/* 連結 */
.links{display:grid;gap:calc(var(--gap)*.75)}
.lk{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 16px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--lr);font-weight:600;transition:transform .15s}
.lk:hover{transform:translateY(-1px)}
.lk:active{transform:scale(.985)}
.lk i{flex:none;width:36px;height:36px;border-radius:min(var(--lr),12px);background:color-mix(in srgb,var(--ax) 13%,transparent);color:var(--ax);display:grid;place-items:center;font-style:normal;overflow:hidden}
.lk i img{width:100%;height:100%;object-fit:cover}
.lk span{flex:1;overflow-wrap:anywhere}
.lk b{opacity:.4;font-weight:400}
[data-lnk=fill] .lk,[data-lnk=fill] .qa i{background:var(--ac);color:var(--acf);border-color:transparent}
[data-lnk=fill] .lk i{background:rgba(255,255,255,.2);color:inherit}
[data-lnk=outline] .lk,[data-lnk=outline] .qa i{background:transparent;border:1.5px solid var(--ax)}
[data-lnk=glass] .lk,[data-lnk=glass] .qa i{background:color-mix(in srgb,var(--sf) 60%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
/* 磚塊排列 */
[data-lyt=grid] .links{grid-template-columns:repeat(2,minmax(0,1fr))}
[data-lyt=grid] .lk{flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:108px;padding:14px}
[data-lyt=grid] .lk b{display:none}
[data-lyt=grid] .lk span{flex:none;width:100%}
[data-lyt=grid] .lk:last-child:nth-child(odd){grid-column:1/-1;min-height:64px;flex-direction:row;align-items:center;justify-content:flex-start}
[data-lyt=grid] .lk:last-child:nth-child(odd) span{flex:1;width:auto}
/* 聯絡 */
.ct{display:grid;gap:12px}
.ct a,.ct div{display:flex;gap:12px;align-items:flex-start;overflow-wrap:anywhere}
.ct svg{flex:none;margin-top:3px;color:var(--ax)}
.ft{display:flex;gap:14px;align-items:center}
.ft img{max-height:40px;max-width:96px;object-fit:contain}
/* 背景：頂部光暈／範本背景圖（SVG，隨配色變化；也可上傳自己的圖） */
[data-bgm=gradient] body{background:radial-gradient(120% 55% at 50% 0,color-mix(in srgb,var(--ac) 36%,transparent),transparent 70%) var(--bg);background-repeat:no-repeat}
[data-bgm=image] #card{min-height:100dvh;background:var(--pbg,none) center top/var(--pbs,100% auto) no-repeat}
/* 進場動畫（僅首次載入） */
@keyframes up{from{opacity:0;transform:translateY(12px)}}
#card.in .secs>*{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
#card.in .secs>:nth-child(2){animation-delay:.06s}#card.in .secs>:nth-child(3){animation-delay:.12s}#card.in .secs>:nth-child(4){animation-delay:.18s}#card.in .secs>:nth-child(5){animation-delay:.24s}#card.in .secs>:nth-child(n+6){animation-delay:.3s}
@media(prefers-reduced-motion:reduce){#card.in .secs>*{animation:none}}

/* ===== 內容對齊 ===== */
.box[data-al=left]{text-align:left}.box[data-al=center]{text-align:center}.box[data-al=right]{text-align:right}
.ct[data-al=left] a,.ct[data-al=left] div{justify-content:flex-start}
.ct[data-al=center] a,.ct[data-al=center] div{justify-content:center}
.ct[data-al=right] a,.ct[data-al=right] div{justify-content:flex-end}
.ft[data-al=center]{justify-content:center}.ft[data-al=right]{justify-content:flex-end}

/* ===== 圖片裁切視窗 ===== */
.cp{display:grid;gap:12px;text-align:left}
.cp h3{text-align:center;font-size:18px}
.cp label{margin:0}
#cst{position:relative;margin:0 auto;overflow:hidden;border-radius:12px;background:#1c1c1e;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#cst:active{cursor:grabbing}
#cst img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
#cst::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);background:linear-gradient(rgba(255,255,255,.32),rgba(255,255,255,.32)) 33.33% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.32),rgba(255,255,255,.32)) 66.66% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.32),rgba(255,255,255,.32)) 0 33.33%/100% 1px no-repeat,linear-gradient(rgba(255,255,255,.32),rgba(255,255,255,.32)) 0 66.66%/100% 1px no-repeat}
.thr{flex-wrap:wrap}

/* ===== 底部列 ===== */
#bar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;z-index:10;width:100%;max-width:480px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;background:linear-gradient(to top,var(--bg) 70%,transparent);pointer-events:none}
#bar>*{pointer-events:auto}
.pri{flex:1;min-height:50px;border:0;border-radius:16px;background:var(--ac);color:var(--acf);font-weight:700;cursor:pointer;box-shadow:0 8px 22px -6px rgba(0,0,0,.35)}
.ic{flex:none;width:50px;height:50px;border:1px solid var(--bd);border-radius:16px;background:var(--sf);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.pri:active,.ic:active{transform:scale(.96)}
.pri:disabled{opacity:.6}

/* ===== 編輯面板 ===== */
#sheet{--bg:#f4f5f7;--fg:#16181d;--sf:#fff;--bd:#e0e2e7;--mu:#6a6f7a;--sa:#2b45f0;position:fixed;left:0;right:0;bottom:0;margin:0 auto;z-index:20;width:100%;max-width:480px;height:62vh;min-height:240px;max-height:100%;background:var(--bg);color:var(--fg);border-radius:24px 24px 0 0;display:none;flex-direction:column;overflow:hidden;box-shadow:0 -12px 40px rgba(0,0,0,.28)}
#sheet.open{display:flex;-webkit-animation:sheetUp .32s ease-out;animation:sheetUp .32s ease-out}
#sheet.closing{display:flex;-webkit-animation:sheetDown .25s ease-in forwards;animation:sheetDown .25s ease-in forwards}
@-webkit-keyframes sheetUp{from{-webkit-transform:translateY(100%)}to{-webkit-transform:translateY(0)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@-webkit-keyframes sheetDown{from{-webkit-transform:translateY(0)}to{-webkit-transform:translateY(100%)}}
@keyframes sheetDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
body.editing #card{padding-bottom:64vh;padding-bottom:64dvh}
body.editing #bar{display:none}
.top{flex:none;display:flex;gap:10px;align-items:center;padding:14px 14px 8px}
.seg{flex:1;display:flex;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px 2px;font-size:13px;font-weight:600;color:var(--mu);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--sa);color:#fff}
#done{flex:none;border:0;background:var(--sa);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;cursor:pointer}
#form{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 16px calc(40px + env(safe-area-inset-bottom,0px))}
label{display:grid;gap:5px;font-size:13px;color:var(--mu);margin-bottom:12px}
input[type=text],input[type=url],input[type=email],input[type=password],textarea,select{width:100%;background:var(--sf);border:1.5px solid var(--bd);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--fg);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--sa)}
input[type=file]{width:100%;font-size:13px}
input[type=range]{width:100%;accent-color:var(--sa)}
input[type=color]{width:100%;height:44px;padding:3px;border:1.5px solid var(--bd);border-radius:12px;background:var(--sf);cursor:pointer}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.it{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px}
.gb{background:var(--sf);border:1.5px solid var(--bd);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg)}
.gb.on{border-color:var(--sa);color:var(--sa);background:color-mix(in srgb,var(--sa) 8%,#fff)}
.gb.del{color:#e5484d}
.gb.main{background:var(--sa);border-color:var(--sa);color:#fff;padding:13px 14px;font-size:15px}
.fl{display:flex;gap:8px;flex-wrap:wrap}
h4{margin:22px 0 10px;font-size:14px}
.sl{font-size:12px;font-weight:700;color:var(--mu);margin:14px 0 8px;letter-spacing:.02em}.sl:first-child{margin-top:2px}
.ac{background:var(--sf);border:1px solid var(--bd);border-radius:16px;margin-bottom:10px;overflow:hidden}
.ach{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:none;border:0;text-align:left;cursor:pointer;color:var(--fg)}
.aci{flex:none;width:36px;height:36px;border-radius:11px;background:rgba(43,69,240,.1);display:grid;place-items:center;font-size:18px}
.act{flex:1;display:grid;gap:1px;min-width:0}.act b{font-size:15px}.act small{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);margin:0 4px 3px 0;transition:transform .2s}
.open>.ach .chev,.rw.x .rt .chev{transform:rotate(-135deg);margin:3px 4px 0 0}
.acb{padding:2px 14px 14px;border-top:1px solid var(--bd)}
.chs{display:grid;gap:8px}.chs.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.chs.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.chs.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ch{display:grid;justify-items:center;gap:3px;padding:8px 2px 7px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);cursor:pointer;font-size:12px;font-weight:600;color:var(--mu)}
.ch svg{width:34px;height:34px}.ch.on{border-color:var(--sa);color:var(--sa);background:rgba(43,69,240,.08)}
.clr{position:relative;display:flex;align-items:center;gap:12px;margin:0;padding:9px 12px;background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;cursor:pointer;color:var(--fg);font-size:14px}
.sw2{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--bd)}
.cn{flex:1;display:grid;font-weight:600}.cn small{font-size:11px;color:var(--mu);font-weight:500;letter-spacing:.04em}.clr em{font-style:normal;font-size:11px;color:var(--sa)}
.clr input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px 0 4px}.slot{display:flex;flex-direction:column;border:1.5px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--bg)}
.sth{flex:none;width:100%;height:84px;margin:0;border-radius:0;border:0;border-bottom:1.5px dashed var(--bd);background:var(--sf);display:grid;place-items:center;overflow:hidden;cursor:pointer}
.sth img{width:100%;height:100%;object-fit:cover}.sth em{font-style:normal;font-size:22px;color:var(--mu)}
.slot input[type=file]{display:none}.sti{display:grid;gap:3px;min-width:0;padding:8px 10px 10px}.sti b{font-size:14px;color:var(--fg)}.sti small{font-size:11px;color:var(--mu)}.sti .fl{margin-top:3px}
.gb.up{display:inline-block;margin:0;color:var(--fg);font-size:13px}
.rw{background:var(--bg);border:1px solid var(--bd);border-radius:14px;margin-bottom:8px}.rw.sys{border-style:dashed}
.rh{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px}
.rt{flex:1;display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;text-align:left;cursor:pointer;color:var(--fg);padding:4px 0}
.ri{flex:none;width:32px;height:32px;border-radius:10px;background:rgba(43,69,240,.1);color:var(--sa);display:grid;place-items:center;font-size:13px;font-weight:700}.ri svg{width:17px;height:17px}
.rt2{flex:1;display:grid;min-width:0}.rt2 b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rt2 small{font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvs{display:flex;gap:4px;flex:none}.mb{width:40px;height:40px;border:1.5px solid var(--bd);border-radius:10px;background:var(--sf);cursor:pointer;font-size:15px;color:var(--fg)}.mb:disabled{opacity:.3}
.gb.sw3{padding:9px 12px;font-size:12px}.rb{padding:2px 12px 12px;border-top:1px solid var(--bd);margin-top:2px;padding-top:12px}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.bh .gb{padding:7px 12px}
.gb:disabled{opacity:.35;cursor:default}
.it.sys{background:transparent;border-style:dashed}
label.cl{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0}
label.cl input[type=color]{width:64px;flex:none}
h4:first-child{margin-top:4px}
.hint{font-size:12px;color:var(--mu);margin:-4px 0 10px;line-height:1.55}
.tp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tp button{border:2px solid var(--bd);border-radius:14px;background:var(--sf);padding:8px 4px;cursor:pointer;font-size:12px;font-weight:600;color:var(--fg);display:grid;gap:6px;justify-items:center}
.tp button.on{border-color:var(--sa)}
.tp svg{width:100%;max-width:72px;height:auto;border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.imgf{margin-bottom:12px}.imgf label{margin-bottom:8px}.thr{display:flex;align-items:center;gap:12px}.th{width:56px;height:56px;object-fit:cover;border-radius:12px;border:1px solid var(--bd);background:#fff}
.sw button.on{border-color:var(--sa);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--sa)}
.sw button{width:42px;height:42px;border-radius:50%;border:2px solid var(--bd);cursor:pointer}
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
#modal[hidden]{display:none}
.md{--sf:#fff;--fg:#16181d;--bd:#e0e2e7;--mu:#6a6f7a;--sa:#2b45f0;position:relative;background:#fff;color:#16181d;border-radius:24px;padding:28px 24px 22px;max-width:340px;width:100%;text-align:center}
.md .pri{width:100%;background:#2b45f0;color:#fff;box-shadow:none}
.md .sub{font-size:13px;color:#6a6f7a;text-align:center;overflow-wrap:anywhere}
.tl{border:0;background:none;color:#2b45f0;font-size:13px;cursor:pointer;padding:6px 2px}
.tl:disabled{color:#9aa0ab;cursor:default}
#mx{position:absolute;top:6px;right:6px;width:40px;height:40px;border:0;background:none;font-size:20px;cursor:pointer;color:#6a6f7a}
#qrb{display:flex;justify-content:center;margin:6px 0 14px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:#1c1c1e;color:#fff;padding:10px 18px;border-radius:30px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== 人像造型頭部（拱形／側邊漸隱／拍立得／圓環） ===== */
[data-hdr^=pt] .cv{display:block;background:var(--ac) center/cover no-repeat;background-position:50% var(--fy,50%)}
[data-hdr^=pt] .av{display:none}
[data-hdr^=pt] .who{padding:0;gap:0}
[data-hdr^=pt] h1{color:var(--fg);font-size:clamp(26px,8.4vw,34px);line-height:1.15}
[data-hdr=ptarch] .hd,[data-hdr=ptpola] .hd,[data-hdr=ptring] .hd{padding:calc(30px + env(safe-area-inset-top,0px)) 20px 4px;text-align:center}
[data-hdr=ptarch] .who,[data-hdr=ptpola] .who,[data-hdr=ptring] .who{flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding-top:24px}
[data-hdr=ptarch] .cv{width:min(68%,270px);height:auto;aspect-ratio:3/4;margin:8px auto 0;border-radius:999px 999px 24px 24px;outline:2px solid var(--ac);outline-offset:8px}
[data-hdr=ptpola] .hd{position:relative}
[data-hdr=ptpola] .hd::before{content:"";position:absolute;z-index:1;top:calc(24px + env(safe-area-inset-top,0px));left:50%;width:84px;height:24px;margin-left:-42px;background:color-mix(in srgb,var(--ac) 40%,#fff);opacity:.8;transform:rotate(-3deg)}
[data-hdr=ptpola] .cv{width:min(70%,280px);height:auto;aspect-ratio:4/5;margin:10px auto 0;border:10px solid #fff;border-bottom-width:48px;border-radius:3px;transform:rotate(-3deg);box-shadow:0 18px 32px -12px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.14)}
[data-hdr=ptring] .hd{background:radial-gradient(120% 70% at 50% 0,color-mix(in srgb,var(--ac) 22%,transparent),transparent 72%)}
[data-hdr=ptring] .cv{width:min(46vw,190px);height:auto;aspect-ratio:1;margin:0 auto;border-radius:50%;box-shadow:0 0 0 6px var(--bg),0 0 0 8px var(--ac),0 18px 34px -12px color-mix(in srgb,var(--ac) 55%,transparent)}
[data-hdr=ptside] .hd{position:relative;overflow:hidden;height:clamp(340px,96vw,440px)}
[data-hdr=ptside] .hd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(to top,var(--bg),transparent);pointer-events:none}
[data-hdr=ptside] .cv{position:absolute;top:0;right:0;bottom:0;width:70%;height:auto;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 45%);mask-image:linear-gradient(to right,transparent 0,#000 45%)}
[data-hdr=ptside] .who{position:absolute;left:0;bottom:0;width:58%;z-index:1;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;padding:0 0 26px 22px}
[data-hdr=ptside] h1{font-size:clamp(30px,10vw,42px);line-height:1.08;text-shadow:0 0 22px var(--bg),0 0 8px var(--bg)}

/* ===== 編輯器：版型分類、字體選擇、無障礙 ===== */
.tcs{display:flex;gap:8px;margin:0 0 12px;overflow-x:auto;padding-bottom:2px}
.tc{flex:none;border:1.5px solid var(--bd);background:var(--sf);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--mu);cursor:pointer;white-space:nowrap}
.tc.on{background:var(--sa);border-color:var(--sa);color:#fff}
.tp button.on{box-shadow:0 0 0 1px var(--sa)}
.nt{display:grid;gap:6px;margin:14px 0 4px;padding:12px 14px;border:1.5px dashed var(--bd);border-radius:14px;background:var(--sf)}
.nt b{font-size:14px;color:var(--fg)}.nt span{font-size:12px;color:var(--mu);line-height:1.5}.nt .gb{margin-top:4px}
.fnt{padding:11px 4px 9px}.fnt b{font-size:19px;line-height:1.3;color:var(--fg);white-space:nowrap}.fnt span{font-size:11px}
:focus-visible{outline:2px solid var(--ax,#2b45f0);outline-offset:2px}
#sheet :focus-visible,#modal :focus-visible{outline-color:#2b45f0}
#sheet input:focus-visible,#sheet textarea:focus-visible,#sheet select:focus-visible{outline:none}
@media(prefers-reduced-motion:reduce){#sheet.open,#sheet.closing{animation:none}.toast{transition:none}}
</style>
</head>

const newCred=async p=>{const salt=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('');return{salt,h:await hash(salt+p)}};
const pwCheck=(p,q)=>{if(p.length<4)throw new Error('密碼至少 4 個字元');if(p!==q)throw new Error('兩次輸入不一致')};

/* 忘記密碼通關字：輸入 Makabacard（不分大小寫）即可重設密碼 */
const RESET_WORD='makabacard';

const wrap=(title,sub,body)=>`<form id="pf" style="display:grid;gap:10px;text-align:left"><h3 style="text-align:center;font-size:18px">${title}</h3><p class="sub">${sub}</p>${body}</form>`;
const fld=(id,ph,t='password')=>`<input type="${t}" id="${id}" placeholder="${ph}" autocomplete="off">`;
function view(html,onSubmit,focus='p1'){
  modal(html);setTimeout(()=>{const i=$('#'+focus);i&&i.focus()},60);
  $('#pf').onsubmit=async e=>{
    e.preventDefault();const b=$('#pf button[type=submit]');b&&(b.disabled=true);
    try{await onSubmit()}catch(err){toast(err.message||'發生錯誤')}
    finally{if(b&&b.isConnected)b.disabled=false}
  };
}
const enter=cb=>{unlocked=true;$('#modal').hidden=true;cb&&cb()};

function authStart(cb){acct().h?viewLogin(cb):viewSetup(cb)}
function viewLogin(cb){
  view(wrap('作者登入','請輸入編輯密碼',`${fld('p1','密碼')}<button class="pri" type="submit">進入編輯</button><button type="button" class="tl" id="fg">忘記密碼？</button>`),async()=>{
    const a=acct();
    if(await hash((a.salt||'')+$('#p1').value)!==a.h){$('#p1').value='';throw new Error('密碼錯誤')}
    enter(cb);
  });
  $('#fg').onclick=()=>viewForgot(cb);
}
function viewSetup(cb){
  view(wrap('建立編輯帳號','設定編輯密碼。忘記密碼時，輸入通關字即可重設。',`${fld('p1','設定密碼（至少 4 字元）')}${fld('p2','再輸入一次密碼')}<button class="pri" type="submit">建立並進入編輯</button>`),async()=>{
    const p=$('#p1').value;
    pwCheck(p,$('#p2').value);
    setAcct(await newCred(p));toast('密碼已建立');enter(cb);
  });
}
function viewForgot(cb){
  view(wrap('忘記密碼','請輸入通關字，驗證成功後即可設定新密碼。',`${fld('p1','通關字','text')}<button class="pri" type="submit">驗證</button><button type="button" class="tl" id="bk">返回登入</button>`),async()=>{
    if($('#p1').value.trim().toLowerCase()!==RESET_WORD){$('#p1').value='';throw new Error('通關字錯誤')}
    viewNewPw(cb);
  });
  $('#bk').onclick=()=>viewLogin(cb);
}
function viewNewPw(cb){
  view(wrap('設定新密碼','驗證成功，請設定新密碼。',`${fld('p1','新密碼（至少 4 字元）')}${fld('p2','再輸入一次')}<button class="pri" type="submit">儲存並進入編輯</button>`),async()=>{
    const p=$('#p1').value;pwCheck(p,$('#p2').value);
    setAcct({...acct(),...await newCred(p)});toast('密碼已更新');enter(cb);
  });
}
function viewChangePw(){
  view(wrap('變更密碼','請先輸入目前的密碼。',`${fld('p0','目前密碼')}${fld('p1','新密碼（至少 4 字元）')}${fld('p2','再輸入一次')}<button class="pri" type="submit">更新密碼</button>`),async()=>{
    const a=acct();
    if(await hash((a.salt||'')+$('#p0').value)!==a.h)throw new Error('目前密碼錯誤');
    const p=$('#p1').value;pwCheck(p,$('#p2').value);
    setAcct({...a,...await newCred(p)});$('#modal').hidden=true;toast('密碼已更新');
  },'p0');
}


/* ====== 編輯器（離開即鎖定） ====== */
/* 手機鍵盤彈出時，編輯區自動放大到鍵盤上方的可見範圍 */
let baseH=0;
function fitSheet(){
  const sh=$('#sheet'),vv=window.visualViewport,h=vv?vv.height:innerHeight;
  if(!sh.classList.contains('open'))return;
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
  if(!typing||h>=baseH-1)baseH=Math.max(baseH,h,innerHeight);
  const kb=typing&&h<baseH*.8;
  sh.style.height=Math.max(240,Math.round(kb?h-10:h*.62))+'px';
  sh.style.bottom=vv?Math.max(0,Math.round(innerHeight-vv.offsetTop-vv.height))+'px':'0px';
}
if(window.visualViewport){visualViewport.addEventListener('resize',fitSheet);visualViewport.addEventListener('scroll',fitSheet)}
addEventListener('resize',fitSheet);
document.addEventListener('focusin',e=>{if(!e.target.closest('#sheet'))return;
  [120,350].forEach(t=>setTimeout(()=>{fitSheet();try{e.target.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}},t))});
document.addEventListener('focusout',()=>setTimeout(fitSheet,200));
function openEditor(){form();$('#sheet').classList.remove('closing');$('#sheet').classList.add('open');document.body.classList.add('editing');baseH=0;fitSheet()}
function closeEditor(){unlocked=false;const sh=$('#sheet');sh.classList.remove('open');sh.classList.add('closing');document.body.classList.remove('editing');setTimeout(()=>sh.classList.remove('closing'),260)}
$('#ed').onclick=()=>{unlocked?openEditor():authStart(openEditor)};
$('#done').onclick=()=>{closeEditor();toast('已儲存，編輯器已鎖定')};
addEventListener('pagehide',closeEditor);

  ${sec('配色方案','一鍵套用整組顏色；想單獨改某一項，到「設計」分頁對應物件旁邊調整。')}<div class="sw">${PRESETS.map((p,i)=>`<button data-pre="${i}" class="${p[0]===S.c.bg&&p[1]===S.c.sf&&p[2]===S.c.fg&&p[3]===S.c.ac?'on':''}" aria-label="配色 ${i+1}" style="background:linear-gradient(135deg,${p[0]} 50%,${p[3]} 50%)"></button>`).join('')}</div>`;
  }
  else if(tab===2){
    h=ac('hdr','👤','頭部',`${LB.hdr[S.hdr]}${fixLay?'':' · '+LB.lay[S.lay]}${photo?'':' · '+LB.av[S.av]+'頭像'}`,
      `${sl('一般頭部')}${pick('hdr','hdr',[['none','無'],['cover','封面圖'],['band','色塊']])}${sl('人像頭部')}${pick('hdr','hdr',[['photo','照片背景'],['photoc','照片卡片'],['photofull','滿版照片'],['ptarch','拱形人像'],['ptside','側邊人像'],['ptpola','拍立得'],['ptring','圓環人像']])}
      ${photo&&!S.avatar?`<p class="hint" style="margin-top:10px;color:#c2410c">要用你的人像：請先上傳照片。</p><button class="gb" data-go="0:brand">到「內容」上傳照片</button>`:''}
      ${fixLay?'':`${sl('文字排版')}${pick('lay','lay',[['left','靠左'],['center','置中'],['right','靠右']])}`}
      ${photo?'':`${sl('頭像形狀')}${pick('av','av',[['circle','圓形'],['rounded','圓角'],['square','方形'],['blob','水滴']],4)}${rng('頭像大小','avs',S.avs,56,140)}`}`)
    +ac('bg','🌄','頁面背景',`${LB.bgm[S.bgm]} · ${S.c.bg.toUpperCase()}`,
      `${sl('背景樣式')}${pick('bgm','bgm',[['solid','純色'],['gradient','頂部光暈'],['image','背景圖']])}
      ${sl('背景顏色')}${colr('背景色','bg')}
      <p class="hint" style="margin:10px 0 8px">背景圖預設用範本內建圖案，會跟著配色變化。${S.pbg?'目前使用你上傳的圖。':''}</p><button class="gb" data-go="0:brand">${S.pbg?'更換':'上傳'}自訂背景圖</button>`)
    +ac('txt','🔤','文字',`標題 ${FONTS[S.font].n}・內文 ${FONTS[S.bf].n}`,
      `${sl('標題字體（姓名、區塊標題）')}${fpick('font')}${sl('內文字體')}${fpick('bf')}<p class="hint" style="margin-top:10px">字體會在選用時才載入，需連網；離線時自動改用系統字體。</p>${sl('文字顏色')}${colr('文字色','fg')}`)
    +ac('lnk','🔗','連結與按鈕',`${LB.lyt[S.lyt]} · ${LB.lnk[S.lnk]} · ${LB.shape[S.shape]}`,
      `${sl('連結排列')}${pick('lyt','lyt',[['list','條列'],['grid','磚塊（兩欄）']],2)}${sl('按鈕樣式')}${pick('lnk','lnk',[['solid','淺底'],['fill','主色填滿'],['outline','線框'],['glass','玻璃']],4)}${sl('按鈕形狀')}${pick('shape','shape',[['rounded','圓角'],['pill','膠囊'],['square','方角']])}${sl('主題色（按鈕、重點）')}${colr('主題色','ac')}`)
    +ac('box','▦','內容區塊',`${LB.box[S.box]} · 圓角 ${S.rad}`,
      `${sl('區塊樣式')}${pick('box','box',[['solid','實心'],['outline','線框'],['flat','無框'],['glass','玻璃'],['shadow','陰影']])}${sl('卡片顏色')}${colr('卡片色','sf')}${rng('區塊圓角','rad',S.rad,0,36)}${rng('區塊間距','gap',S.gap,6,30)}`)
    +ac('al','↔️','內容對齊',Object.values(S.al).every(x=>x===S.al.bio)?'全部'+ALN[S.al.bio]:'各區塊分別設定',
      `${alp('all','全部一次設定')}${sl('姓名・職稱（頭部）')}${fixLay?'<p class="hint">這個人像版型的姓名排版是固定的，想自由調整請改選其他頭部樣式。</p>':pick('lay','lay',[['left','靠左'],['center','置中'],['right','靠右']])}${alp('bio','個人簡介')}${alp('ct','聯絡資訊')}${alp('tx','圖文區塊')}${alp('ft','頁尾資訊')}`)
    +`<button class="gb del" id="rs" style="width:100%;margin-top:14px">重設為範例名片</button>`;
  }
  else{h=`  <h4>帳號安全</h4>
  <p class="hint">按右上角「完成」離開編輯器時會自動鎖定，下次編輯需重新輸入密碼。</p>
  <div class="fl"><button class="gb" id="cp">變更密碼</button></div>
  <h4>備份與還原</h4>
  <p class="hint">資料存在這個瀏覽器裡。換電腦或清除瀏覽器資料前，請先備份。</p>
  <div class="fl"><button class="gb" id="bk">下載備份檔</button></div>
  <h4>發佈名片</h4>
  <p class="hint">編輯資料只存在目前這個瀏覽器，別的裝置看不到。編輯完請按「下載發佈版」，把下載的 HTML 上傳到網站取代舊檔，分享連結才會是你編輯後的內容。</p>
  <div class="fl"><button class="gb main" id="pub">下載發佈版 HTML</button></div>
  <label style="margin-top:10px">還原備份<input type="file" accept=".json,application/json" id="rt"></label>`}
  $('#form').innerHTML=h;$('#form').scrollTop=st;
}
function walk(path){const k=path.split('.');let o=S;k.slice(0,-1).forEach(x=>o=o[x]);return[o,k.at(-1)]}
function exportPub(){
  S._ts=Date.now();save();
  const d=document.documentElement.cloneNode(true);
  ['style','data-hdr','data-lay','data-av','data-box','data-lnk','data-lyt','data-bgm'].forEach(a=>d.removeAttribute(a));
  d.setAttribute('data-t','cover');
  ['#card','#form','#seg','#mb','#qrb'].forEach(q=>{const e=d.querySelector(q);if(e)e.innerHTML=''});
  d.querySelector('body').removeAttribute('class');d.querySelector('body').removeAttribute('style');
  const sh=d.querySelector('#sheet');sh.removeAttribute('class');sh.removeAttribute('style');
  d.querySelector('#modal').setAttribute('hidden','');
  d.querySelector('#toast').className='toast';d.querySelector('#toast').textContent='';
  d.querySelectorAll('link[href*="fonts.googleapis.com/css2"]').forEach(x=>x.remove());
  d.querySelectorAll('#pub-data').forEach(x=>x.remove());
  const ps=document.createElement('script');ps.id='pub-data';
  ps.textContent='window.__PUB__='+JSON.stringify(S).replace(/</g,'\\u003c')+';';
  d.querySelector('#js').before(ps);
  download('index.html','<!DOCTYPE html>\n'+d.outerHTML,'text/html');
  toast('已下載發佈版，請上傳取代網站上的舊檔',3200);
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

/* ===== 圖片裁切／縮放：拖曳移動、滑桿／雙指／滾輪縮放、可選比例 ===== */
const CR=[['1:1',1],['4:5',.8],['3:4',.75],['9:16',.5625],['3:2',1.5],['16:9',1.7778],['2:1',2],['原比例',0]];
function cropDefault(key){
  if(key==='logo')return 0;
  if(key==='pbg')return .5625;
  if(key==='bg')return 2;
  if(key==='avatar'&&PH(S.hdr))return({ptarch:.75,ptside:.75,ptpola:.8,photofull:.75}[S.hdr]||1);
  return 1;
}
function openCrop(key,src){
  const im=new Image();
  im.onerror=()=>toast('無法讀取這張圖片');
  im.onload=()=>{
    const iw=im.naturalWidth,ih=im.naturalHeight;
    const isIcon=key.includes('icon'),png=key==='logo'||isIcon;
    const mxs=isIcon?256:key==='logo'?400:(key==='bg'||key==='pbg')?1200:900;
    let ratio=cropDefault(key),W=0,H=0,s=1,cov=1,z=1,ox=0,oy=0;
    const lay=()=>{
      const MW=292,MH=340;
      let r=ratio||iw/ih;r=Math.min(3,Math.max(.4,r));
      if(MW/r<=MH){W=MW;H=Math.round(MW/r)}else{H=MH;W=Math.round(MH*r)}
      cov=Math.max(W/iw,H/ih);z=1;s=cov;ox=(W-iw*s)/2;oy=(H-ih*s)/2;
    };
    const draw=()=>{
      ox=Math.min(0,Math.max(W-iw*s,ox));oy=Math.min(0,Math.max(H-ih*s,oy));
      const st=$('#cst'),g=st.firstChild;
      st.style.width=W+'px';st.style.height=H+'px';
      g.style.width=iw*s+'px';g.style.height=ih*s+'px';g.style.left=ox+'px';g.style.top=oy+'px';
    };
    const setZ=(nz,cx=W/2,cy=H/2)=>{
      nz=Math.min(4,Math.max(1,nz));
      const px=(cx-ox)/s,py=(cy-oy)/s;
      z=nz;s=cov*nz;ox=cx-px*s;oy=cy-py*s;draw();$('#czm').value=z;
    };
    const mark=()=>document.querySelectorAll('#crr .gb').forEach(b=>b.classList.toggle('on',+b.dataset.r===ratio));
    cropping=true;
    modal(`<div class="cp"><h3>調整圖片</h3><div id="cst"><img alt=""></div><p class="sub" style="text-align:center">拖曳移動位置，滑桿或雙指縮放</p><label>縮放<input type="range" id="czm" min="1" max="4" step="0.01" value="1"></label><div class="fl" id="crr">${CR.map(([n,v])=>`<button type="button" class="gb sw3" data-r="${v}">${n}</button>`).join('')}</div><button class="pri" id="cok" type="button">套用</button><button class="tl" id="cno" type="button">取消</button></div>`);
    $('#cst img').src=src;
    lay();draw();mark();
    $('#crr').onclick=e=>{const b=e.target.closest('.gb');if(!b)return;ratio=+b.dataset.r;lay();draw();$('#czm').value=1;mark()};
    $('#czm').oninput=e=>setZ(+e.target.value);
    const st=$('#cst'),pts=new Map();let d0=0,z0=1;
    const dist=()=>{const[a,b]=[...pts.values()];return[Math.hypot(a[0]-b[0],a[1]-b[1]),(a[0]+b[0])/2,(a[1]+b[1])/2]};
    st.onpointerdown=e=>{
      try{st.setPointerCapture(e.pointerId)}catch(_){}
      pts.set(e.pointerId,[e.clientX,e.clientY]);
      if(pts.size===2){d0=dist()[0];z0=z}
    };
    st.onpointermove=e=>{
      if(!pts.has(e.pointerId))return;
      const p=pts.get(e.pointerId);
      pts.set(e.pointerId,[e.clientX,e.clientY]);
      if(pts.size===1){ox+=e.clientX-p[0];oy+=e.clientY-p[1];draw()}
      else if(pts.size===2&&d0){const[d,mx,my]=dist(),r=st.getBoundingClientRect();setZ(z0*d/d0,mx-r.left,my-r.top)}
    };
    st.onpointerup=st.onpointercancel=e=>{pts.delete(e.pointerId)};
    st.onwheel=e=>{e.preventDefault();const r=st.getBoundingClientRect();setZ(z*(e.deltaY<0?1.08:1/1.08),e.clientX-r.left,e.clientY-r.top)};
    $('#cno').onclick=()=>{cropping=false;$('#modal').hidden=true};
    $('#cok').onclick=()=>{
      const sw=W/s,sh=H/s,sx=Math.max(0,Math.min(iw-sw,-ox/s)),sy=Math.max(0,Math.min(ih-sh,-oy/s));
      const sc=Math.min(1,mxs/Math.max(sw,sh)),cw=Math.max(1,Math.round(sw*sc)),ch=Math.max(1,Math.round(sh*sc));
      const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
      const cx=cv.getContext('2d');
      if(!png){cx.fillStyle='#fff';cx.fillRect(0,0,cw,ch)}
      cx.drawImage(im,sx,sy,sw,sh,0,0,cw,ch);
      let out=png?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',.85);
      if(png&&out.length>350000){cx.globalCompositeOperation='destination-over';cx.fillStyle='#fff';cx.fillRect(0,0,cw,ch);out=cv.toDataURL('image/jpeg',.85)}
      const[o,k]=walk(key);o[k]=out;
      if(key==='pbg')S.bgm='image';
      cropping=false;$('#modal').hidden=true;save();form();render();
    };
  };
  im.src=src;
}

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='rt'&&el.files[0]){
    const fr=new FileReader();fr.onload=()=>{try{load(JSON.parse(fr.result));save();form();render();toast('已還原備份')}catch(_){toast('備份檔格式錯誤')}};
    fr.readAsText(el.files[0]);return;
  }
  if(el.dataset.c){S.c[el.dataset.c]=el.value;save();render();const r=el.closest('.clr');if(r){r.querySelector('.sw2').style.background=el.value;r.querySelector('small').textContent=el.value.toUpperCase()}return}
  if(el.dataset.p){const[o,k]=walk(el.dataset.p);o[k]=el.type==='range'?+el.value:el.value;save();render();return}
  if(el.dataset.img&&el.files[0]){
    const key=el.dataset.img,fr=new FileReader();
    fr.onload=()=>{el.value='';openCrop(key,fr.result)};
    fr.readAsDataURL(el.files[0]);
  }
});
$('#sheet').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.tab!==undefined){tab=+d.tab;form();$('#form').scrollTop=0;return}
  if(d.tc){tcat=d.tc;form();return}
  if(d.ac){const[t,id]=d.ac.split(':');acc[t]=acc[t]===id?'':id;form();const el=$('#form [data-ac="'+d.ac+'"]');if(el&&acc[t])el.scrollIntoView({block:'start'});return}
  if(d.bx!==undefined){xb=xb===+d.bx?-1:+d.bx;form();return}
  if(d.go){const[t,id]=d.go.split(':');tab=+t;acc[t]=id;form();$('#form').scrollTop=0;return}
  if(b.id==='bk'){download((S.name||'card')+'-備份.json',JSON.stringify(S),'application/json');toast('已下載備份檔');return}
  if(b.id==='cp'){viewChangePw();return}
  if(b.id==='pub'){exportPub();return}
  if(d.crop){const[o,k]=walk(d.crop);if(o[k])openCrop(d.crop,o[k]);return}
    if(d.tpl){const kp=S.pbg;Object.assign(S,base(d.tpl));S.pbg=kp;if(kp)S.bgm='image';toast('已套用「'+TPL[d.tpl].n+'」'+(PH(S.hdr)&&!S.avatar?'，上傳照片就會看到人像':''),2600)}
  if(d.pre){const p=PRESETS[+d.pre];S.c={bg:p[0],sf:p[1],fg:p[2],ac:p[3]}}
  if(d.o){const[k,v]=d.o.split('|');S[k]=v}
  if(d.tg)S[d.tg]=!S[d.tg];
  if(d.al){const[k,v]=d.al.split('|');if(k==='all')Object.keys(S.al).forEach(x=>S.al[x]=v);else S.al[k]=v}
  if(d.rm){const[o,k]=walk(d.rm);o[k]='';if(d.rm==='pbg'&&S.bgm==='image'&&!PAGE[S.tpl])S.bgm='solid'}
  if(d.bm){const[i,n]=d.bm.split(',').map(Number),j=i+n;if(j>=0&&j<S.blocks.length){[S.blocks[i],S.blocks[j]]=[S.blocks[j],S.blocks[i]];if(xb===i)xb=j;else if(xb===j)xb=i}}
  if(d.bd){S.blocks.splice(+d.bd,1);xb=-1}
  if(d.bc){const i=+d.bc;S.blocks.splice(i+1,0,JSON.parse(JSON.stringify(S.blocks[i])));xb=i+1}
  if(d.add==='link'){S.blocks.push({k:'link',type:'other',label:'新連結',url:'',icon:''});xb=S.blocks.length-1}
  if(d.add==='text'){S.blocks.push({k:'text',title:'新區塊',body:'請輸入內容'});xb=S.blocks.length-1}
  if(b.id==='rs'){if(!d.k){d.k=1;b.textContent='再按一次確認重設';return}S=DEF()}
  if(b.id==='cl'){if(!d.k){d.k=1;b.textContent='再按一次確認清空';return}Object.assign(S,JSON.parse(JSON.stringify(EMPTY)))}
  save();form();render();
});

$('#sh').onclick=async()=>{
  if(location.protocol==='file:'){toast('請先把名片放到網站上，再分享連結');return}
  try{if(navigator.share){await navigator.share({title:S.name,text:S.name+' 的數位名片',url:location.href});return}}catch(e){return}
  try{await navigator.clipboard.writeText(location.href);toast('已複製名片連結')}catch(e){toast('無法複製連結')}
};
$('#qr').onclick=()=>{
  const w=location.protocol==='file:'?'<p style="font-size:12px;color:#c2410c;margin-bottom:10px">目前是本機檔案，請先放到網站上，再用網站網址產生 QR。</p>':'';
  modal(w+'<div id="qrb"></div><p style="font-size:13px;color:#6a6f7a">掃描即可開啟這張名片</p>');
  try{new QRCode($('#qrb'),{text:location.href,width:200,height:200})}catch(e){$('#qrb').textContent='QR Code 載入失敗'}
};
$('#vc').onclick=()=>{
  const v=s=>String(s||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const t=['BEGIN:VCARD','VERSION:3.0','FN:'+v(S.name),'TITLE:'+v(S.title),'ORG:'+v(S.company),S.phone&&'TEL;TYPE=CELL:'+v(S.phone),S.email&&'EMAIL:'+v(S.email),S.site&&'URL:'+S.site,S.addr&&'ADR;TYPE=WORK:;;'+v(S.addr)+';;;;','END:VCARD'].filter(Boolean).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/vcard'}));a.download=(S.name||'card')+'.vcf';document.body.appendChild(a);a.click();a.remove();
  toast('聯絡人檔案已開始下載');
};
render();
